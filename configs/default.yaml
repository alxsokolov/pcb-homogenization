# Default parameters for the PCB homogenization pipeline
# All values can be overridden per-run via CLI flags.

board:
  width_mm: 50.0       # square side for the homogenization RVE
  height_mm: 50.0

stackup:
  n_copper_layers: 2
  copper_thickness_mm: 0.035    # 1 oz/ft² copper = 35 µm
  dielectric_material: FR4
  dielectric_thickness_mm: 1.53  # standard 1.6 mm board minus 2×35 µm copper

output:
  dir: data/samples
